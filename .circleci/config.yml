version: 2.1

orbs:
  node: circleci/node@5.2.0

commands:
  install_dependencies:
    steps:
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci
          cache-version: v1

jobs:
  unit-test:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - install_dependencies
      - run:
          name: JavaScript syntax check
          command: npm run check
      - run:
          name: Unit and security tests
          command: npm test

  mysql-integration:
    docker:
      - image: cimg/node:22.14
      - image: mysql:8.4
        environment:
          MYSQL_DATABASE: hr_resume_ci
          MYSQL_USER: hr_app
          MYSQL_PASSWORD: ci_database_password_123
          MYSQL_ROOT_PASSWORD: root_ci_password_123
      - image: redis:7.4-alpine
    environment:
      NODE_ENV: test
      PORT: "5177"
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://hr_app:ci_database_password_123@127.0.0.1:3306/hr_resume_ci
      MYSQL_AUTO_MIGRATE: "true"
      MYSQL_POOL_SIZE: "5"
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-jwt-secret-with-more-than-32-random-characters
      RUN_BACKGROUND_JOBS: "false"
      CI_ADMIN_PASSWORD: CircleCI_Admin_123
      REPORTS_DIR: /tmp/hr-resume-ci-reports
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Install PDF runtime
          command: |
            sudo apt-get update
            sudo apt-get install -y python3-reportlab fonts-noto-cjk
      - run:
          name: Initialize MySQL schema and CI account
          command: npm run ci:seed
      - run:
          name: Start application
          command: npm start
          background: true
      - run:
          name: Full API integration test
          command: npm run ci:verify
      - store_artifacts:
          path: /tmp/hr-resume-ci-reports
          destination: generated-daily-reports

  docker-build:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build production image
          command: docker build -t hr-resume-system:ci .
      - run:
          name: Verify production image runtime
          command: |
            docker run --rm --entrypoint node hr-resume-system:ci --check backend/server.js
            docker run --rm --entrypoint python3 hr-resume-system:ci -c "import reportlab"
            printf '%s' '{"report":{"projectName":"CI","date":"2026-07-28","reportMonth":"2026-07","metrics":{},"currentDayMetrics":{},"distributions":{},"dailyJoinTrend":[],"byProject":[],"todayByProject":[]}}' \
              | docker run -i --rm --entrypoint python3 hr-resume-system:ci backend/report_pdf_generator.py \
              > /tmp/daily-report-smoke.pdf
            test "$(head -c 5 /tmp/daily-report-smoke.pdf)" = "%PDF-"
      - store_artifacts:
          path: /tmp/daily-report-smoke.pdf
          destination: daily-report-smoke.pdf

workflows:
  test-and-build:
    jobs:
      - unit-test
      - mysql-integration:
          requires:
            - unit-test
      - docker-build:
          requires:
            - unit-test
